<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="color-scheme" content="dark">
<title>Nueva contrase&ntilde;a - SORA TV</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#08090D;color:#f2f4fa;font-family:Roboto,Arial,sans-serif;padding:16px}
.card{width:100%;max-width:400px;background:#14172a;border-radius:16px;padding:28px 24px}
h1{margin:0 0 14px;font-size:26px;color:#7657D9}
#msg{margin:0 0 18px;font-size:16px;line-height:1.4;color:#c7cde0}
#msg.ok{color:#7be0a0}
label{display:block;margin:12px 0 6px;font-size:14px;color:#9aa3b8}
input{width:100%;height:46px;padding:0 14px;border-radius:10px;border:2px solid #2b3150;background:#0e1020;color:#fff;font-size:16px}
input:focus{outline:0;border-color:#7657D9}
button{width:100%;height:48px;margin-top:20px;border:0;border-radius:24px;background:#7657D9;color:#fff;font-size:17px;font-weight:700;cursor:pointer}
button:disabled{opacity:.5}
</style>
</head>
<body>
<div class="card">
<h1>SORA TV</h1>
<p id="msg">Verificando enlace...</p>
<form id="f" hidden>
<label for="p1">Nueva contrase&ntilde;a</label>
<input id="p1" type="password" autocomplete="new-password" minlength="6" required>
<label for="p2">Repetir contrase&ntilde;a</label>
<input id="p2" type="password" autocomplete="new-password" minlength="6" required>
<button id="b" type="submit">Guardar contrase&ntilde;a</button>
</form>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js"></script>
<script>
(function(){
var URL_='https://rxzbbpgrdhdwhzzfgygd.supabase.co',KEY_='sb_publishable_YFUXzkixhkGMGPCKqihOlw_YkbBvBBo';
var $=function(i){return document.getElementById(i)};
function msg(t,ok){var m=$('msg');m.textContent=t;m.className=ok?'ok':''}
var VENC='El enlace venci\u00f3 o ya se us\u00f3. Ped\u00ed uno nuevo desde la app.';
if(!window.supabase){msg('No se pudo cargar la p\u00e1gina. Revis\u00e1 tu conexi\u00f3n e intent\u00e1 de nuevo.');return}
var h=location.hash||'';
if(/error=|error_code=/.test(h)){msg(VENC);return}
var sb=window.supabase.createClient(URL_,KEY_,{auth:{persistSession:false,detectSessionInUrl:true}});
var listo=false;
function mostrar(){if(listo)return;listo=true;msg('Eleg\u00ed tu nueva contrase\u00f1a.');$('f').hidden=false;$('p1').focus()}
sb.auth.onAuthStateChange(function(ev,s){if(ev==='PASSWORD_RECOVERY'||(ev==='SIGNED_IN'&&s))mostrar()});
setTimeout(function(){if(listo)return;sb.auth.getSession().then(function(r){if(r&&r.data&&r.data.session)mostrar();else msg(VENC)})},4000);
$('f').addEventListener('submit',function(e){
 e.preventDefault();
 var a=$('p1').value,b=$('p2').value;
 if(a.length<6){msg('La contrase\u00f1a debe tener al menos 6 caracteres.');return}
 if(a!==b){msg('Las contrase\u00f1as no coinciden.');return}
 $('b').disabled=true;msg('Guardando...');
 sb.auth.updateUser({password:a}).then(function(r){
  if(r.error){$('b').disabled=false;msg('No se pudo cambiar la contrase\u00f1a. Prob\u00e1 con otra o ped\u00ed un correo nuevo.');return}
  $('f').hidden=true;msg('Listo. Ya pod\u00e9s volver a la app e iniciar sesi\u00f3n con tu nueva contrase\u00f1a.',true);sb.auth.signOut()
 }).catch(function(){$('b').disabled=false;msg('Error de conexi\u00f3n. Intent\u00e1 de nuevo.')})
});
})();
</script>
</body>
</html>
